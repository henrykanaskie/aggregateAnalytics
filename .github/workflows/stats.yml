name: stats

# Monday, Tuesday and Friday at 15:00 UTC (11am ET), after Sunday's,
# Monday night's and Thursday's games. nflverse posts box scores a few hours
# after each slate but its own runs drift late: on 2026-09-22 the Monday
# night game landed at 14:04 UTC, after the 10:00 run this used to be. A
# partial week is regraded on the next run, as the newest week always is.
#
# Refreshes the current season in the parquet cache, rebuilds the derived
# tables, grades the weeks that have finished, re-uploads the cache and the
# derived tables to the data-cache Release, commits data/odds/graded/. Run it
# by hand with full=true once to seed the cache.
on:
  schedule:
    - cron: "0 15 * * 1,2,5"
  workflow_dispatch:
    inputs:
      full:
        description: "Ingest every season from 1999 (first run, or after a schema break)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NFL_DATA_DIR: ${{ github.workspace }}/data
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dashboard]"
      - name: Fetch the existing cache
        if: ${{ !inputs.full }}
        run: python scripts/fetch_cache.py
      - name: Full ingest
        if: ${{ inputs.full }}
        run: python data_handling/ingest.py
      - name: Refresh current season and rebuild derived tables
        run: bash scripts/refresh_stats.sh
      # Here and not on Render: a played game's closing line only exists in the
      # snapshots taken before kickoff (ESPN drops an event's odds once it is
      # final), and Render keeps ~10 days of those. This checkout has them all.
      - name: Grade the weeks that have finished
        run: python -m dashboard.odds.grading
      # After the lines, so a player angle can say where its prop closed.
      - name: Grade the matchup angles of the weeks that have finished
        run: python -m dashboard.stats.angle_grades
      - name: Upload the cache
        run: bash scripts/push_cache.sh
      - name: Commit grades
        run: |
          git config user.name "Henry Kanaskie"
          git config user.email "howenkan13@gmail.com"
          # `|| true`: data/odds/graded is absent until the first week grades.
          git add data/odds/graded || true
          if git diff --cached --quiet; then
            echo "grades unchanged"; exit 0
          fi
          git commit -m "Grades $(date -u +'%Y-%m-%d')"
          git pull --rebase origin ${{ github.ref_name }}
          git push
      # Every run uploads a fresh cache and fresh derived tables, and Render
      # only reads the Release at build time, so every run wants a build.
      # Nothing this job commits triggers one (grades live under data/odds/,
      # which the app syncs itself), so the service's Deploy Hook asks for it
      # directly. Without the RENDER_DEPLOY_HOOK secret this is skipped, and
      # the site keeps last week's tables until the next code push builds.
      - name: Redeploy Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set; not asking Render to redeploy"; exit 0
          fi
          curl -fsS -X POST "$HOOK" && echo "asked Render to redeploy"
