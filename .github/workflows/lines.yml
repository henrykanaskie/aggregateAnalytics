name: lines

# Four pulls a day, Eastern: ~6am, noon, 6pm, 11pm. Cron is UTC, so these are
# the EDT conversions; in November they drift an hour earlier in ET, which is
# fine. Actions cron can run minutes late and occasionally skip under load:
# treat the schedule as approximate.
on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lines
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[web]"
      - name: Pull lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: bash scripts/pull_lines.sh
      - name: Commit the snapshot
        run: |
          git config user.name "lines-bot"
          git config user.email "lines-bot@users.noreply.github.com"
          git add data/odds
          if git diff --cached --quiet; then
            echo "no new snapshot"; exit 0
          fi
          git commit -m "Lines snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin ${{ github.ref_name }}
          git push
