<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root { color-scheme: light dark;
          --ink: #1c2230; --muted: #6b7280; --rule: #cfcdc4; --ground: #f6f5f1;
          --card: #ffffff; --accent: #1f5c3a; --accent-ink: #fff; --bad: #9b3a2a; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e8e6df; --muted: #9a9890; --rule: #3a3f49; --ground: #15181e;
            --card: #1d2129; --accent: #6fbf8e; --accent-ink: #10231a; --bad: #e08a78; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--ground); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { background: var(--card); border: 1px solid var(--rule); border-radius: 8px;
         padding: 1.75rem 1.75rem 1.5rem; width: min(22rem, calc(100vw - 2rem));
         display: grid; gap: .9rem; }
  h1 { margin: 0; font-size: 1.15rem; }
  p { margin: 0; color: var(--muted); font-size: .92rem; }
  label { display: grid; gap: .35rem; font-size: .85rem; color: var(--muted); }
  input { font: inherit; padding: .55rem .7rem; border: 1px solid var(--rule);
          border-radius: 5px; background: transparent; color: var(--ink); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; padding: .6rem .9rem; border: 0; border-radius: 5px;
           background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  .err { color: var(--bad); font-size: .9rem; min-height: 1.3em; }
</style>
<form id="f" autocomplete="off">
  <h1>nfl_predictor</h1>
  <p>Private dashboard. Enter the site password.</p>
  <label>Password
    <input id="pw" type="password" name="password" autocomplete="current-password" required autofocus>
  </label>
  <div class="err" id="err" aria-live="polite"></div>
  <button id="go" type="submit">Sign in</button>
</form>
<script>
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      err = document.getElementById('err'), go = document.getElementById('go');
  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.textContent = ''; go.disabled = true;
    try {
      var r = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw.value })
      });
      if (r.status === 204) { window.location.replace('/'); return; }
      var msg = 'Sign-in failed.';
      try { msg = (await r.json()).detail || msg; } catch (_) {}
      err.textContent = msg;
      pw.select();
    } catch (_) {
      err.textContent = 'Could not reach the server.';
    } finally { go.disabled = false; }
  });
</script>
