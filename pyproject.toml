[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-predictor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["polars>=1.0", "nflreadpy", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[tool.setuptools.packages.find]
include = ["nfl*", "data_handling*", "model*", "webauth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Redundant once the project is installed with `pip install -e ".[dev]"`, but
# kept so a fresh clone can run the suite before installing anything.
pythonpath = ["."]
addopts = "-q"
markers = ["needs_data: requires the parquet cache to be populated"]
