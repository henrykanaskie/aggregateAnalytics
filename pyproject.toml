[project]
name = "nfl-predictor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["polars>=1.0", "nflreadpy"]

[tool.setuptools.packages.find]
include = ["nfl*", "data_handling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["needs_data: requires the parquet cache to be populated"]
