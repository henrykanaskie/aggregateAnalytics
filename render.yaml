# Render Blueprint: one free web service. Connect the repo in Render, pick
# "Blueprint", and set SITE_PASSWORD (and GH_TOKEN if the repo is private) in
# the dashboard when prompted.
#
# Lines snapshots do not trigger a rebuild (see buildFilter); the running app
# syncs data/odds from GitHub on wake and every 30 minutes. Code and derived
# table pushes do rebuild, which is a handful of times a week.
services:
  - type: web
    name: aggregateanalytics
    runtime: python
    plan: free
    buildCommand: bash scripts/build.sh
    startCommand: uvicorn dashboard.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    buildFilter:
      ignoredPaths:
        - data/odds/**
        - track_record/**
        - tests/**
        - ROADMAP.md
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: NODE_VERSION
        value: "22"
      - key: NFL_SEASON
        value: "2026"
      - key: NFL_DATA_DIR
        value: /opt/render/project/src/data
      # Memory, not speed. The free instance has 512 MB and reports many
      # cores, and polars parallelises every parquet scan across all of them,
      # each thread with its own working set. A research page fires sixteen
      # requests at once; measured on the same data, that burst peaked at
      # 519 MB with the defaults (the process was killed and visitors saw a
      # 502) and at 346 MB with polars on two threads and four requests
      # scanning at a time. The sixteen finish in the same 0.3 s either way.
      - key: POLARS_MAX_THREADS
        value: "2"
      - key: API_WORKERS
        value: "4"
      - key: CACHE_REPO
        value: henrykanaskie/aggregateAnalytics
      - key: ODDS_REPO
        value: henrykanaskie/aggregateAnalytics
      - key: ODDS_REF
        value: main
      # How many days of snapshots this host keeps; older ones are deleted
      # as new pulls arrive, so 512 MB never has to scan a season of lines.
      # Ten days spans the current week and the one just graded. Lower it and
      # grading loses played games, whose lines only exist in the snapshots
      # taken before kickoff (ESPN drops a game's odds once it is final).
      - key: ODDS_KEEP_DAYS
        value: "10"
      - key: SITE_PASSWORD
        sync: false
      # The second password, for the routes that spend credits or write to the
      # log. Unset means those routes are closed to everyone, which is the
      # right default for a host that strangers can reach.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: GH_TOKEN
        sync: false
